name: Content check

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "package.json"

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - name: Confirm generated article output
        run: test -f dist/deploy-manifest.json && test -f dist/sitemap.xml && test -f dist/feed.xml
